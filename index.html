<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Personal training in Chiswick & Bush Hill Park — 1:1 coaching, online programming, and free consultations. Feel stronger, move better, live better." />
    <title>DS Training</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden static form so Netlify's build-time form detection registers the
         booking form and can email notifications on submission. Kept in sync
         field-for-field with the real booking form in src/pages/Booking.jsx. -->
    <form name="booking" data-netlify="true" netlify-honeypot="company" hidden>
      <input type="text" name="company" />
      <input type="text" name="type" />
      <input type="text" name="location" />
      <input type="text" name="date" />
      <input type="text" name="time" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
